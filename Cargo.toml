[package]
name = "p99gate"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "HTTP load testing for CI: open-loop, coordinated-omission-corrected latency, with pass/fail thresholds"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["load-testing", "benchmark", "http", "latency", "ci"]
categories = ["command-line-utilities", "development-tools::testing"]
exclude = ["/.github"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "p99gate"
path = "src/main.rs"

[dependencies]
hdrhistogram = { version = "7.5.4", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that add noise without improving this codebase.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
cast_precision_loss = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util", "macros", "rt"] }
