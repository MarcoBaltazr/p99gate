[package]
name = "p99gate"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "HTTP load testing for CI: open-loop, coordinated-omission-corrected latency, with pass/fail thresholds"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MarcoBaltazr/p99gate"
homepage = "https://github.com/MarcoBaltazr/p99gate"
documentation = "https://docs.rs/p99gate"
readme = "README.md"
keywords = ["load-testing", "benchmark", "http", "latency", "ci"]
categories = ["command-line-utilities", "development-tools::testing"]
exclude = ["/.github"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "p99gate"
path = "src/bin/p99gate/main.rs"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
fastrand = "2.5.0"
hdrhistogram = { version = "7.5.4", default-features = false }
http = "1.5.0"
http-body-util = "0.1.5"
humantime = "2.4.0"
hyper = { version = "1.11.1", features = ["client", "server", "http1", "http2"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "tls12", "ring", "native-tokio", "http2"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "client-proxy", "http1", "http2", "server-auto", "tokio"] }
indicatif = "0.18.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal"] }
tower-service = "0.3.3"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that add noise without improving this codebase.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
cast_precision_loss = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util", "macros", "rt", "rt-multi-thread"] }
